<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Primary Meta Tags -->
    <title>Digital Constructions | ABVC Digital Constructions</title>
    <meta name="title" content="Digital Constructions | ABVC Digital Constructions" />
    <meta name="description" content="Digital Constructions - Eleva tu corporación al siguiente nivel con soluciones de IA, automatización y desarrollo a medida." />

    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abvc-digital.com/" />
    <meta property="og:title" content="Digital Constructions | ABVC Digital Constructions" />
    <meta property="og:description" content="Digital Constructions - Soluciones claras y bien construidas para que tu empresa avance con confianza." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://abvc-digital.com/" />
    <meta property="twitter:title" content="Digital Constructions | ABVC Digital Constructions" />
    <meta property="twitter:description" content="Digital Constructions - Soluciones claras y bien construidas para que tu empresa avance con confianza." />
    <meta property="twitter:image" content="/twitter-image.png" />
  </head>
  <body>
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <p hidden>
        <label>
          Don’t fill this out if you’re human: <input name="bot-field" />
        </label>
      </p>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
